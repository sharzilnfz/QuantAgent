services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: committee
      POSTGRES_PASSWORD: committee
      POSTGRES_DB: committee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U committee"]
      interval: 5s
      timeout: 5s
      retries: 10

  quant:
    build: ./apps/quant
    environment:
      DATABASE_URL: postgres://committee:committee@postgres:5432/committee
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://committee:committee@postgres:5432/committee
      QUANT_SERVICE_URL: http://quant:8000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/auth/me\").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))'"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      quant:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

[project]
name = "committee-quant"
version = "0.1.0"
description = "The Committee — Python quant service (indicators, backtesting, evaluation)"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used by the Dockerfile).
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<0.29",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # False positive: FastAPI builds a TypeAdapter over the request-body
    # annotation, and pydantic >= 2.13 warns about field aliases seen in that
    # position even though they are correctly attached to the model fields.
    # tests/test_api.py proves the `from`/`to`/`asOfMax` aliases work.
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]

[tool.ruff]
line-length = 100

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Committee</title>
    <script>
      // Theme bootstrap: apply the stored (or OS) preference before first paint
      // so there is no flash of the wrong theme while React mounts.
      // The source of truth afterwards is src/theme/ThemeProvider.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('committee.theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
